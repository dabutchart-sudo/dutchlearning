name: Manage Epic Board

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Repository in owner/name form"
        required: true
        default: "dabutchart-sudo/dutchlearning"
        type: string
      epic_issue:
        description: "Epic issue number"
        required: true
        type: string
      project_title:
        description: "GitHub Project title"
        required: true
        type: string
      related_items:
        description: "Comma-separated type:number:status entries"
        required: false
        default: ""
        type: string
  push:
    paths:
      - .github/workflows/manage-epic-board.yml
      - .github/scripts/manage-epic-board.sh

permissions:
  contents: read

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run epic board manager
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          OWNER_NODE_ID: U_kgDODrSTyg
          TARGET_REPO: ${{ github.event.inputs.target_repo || 'dabutchart-sudo/dutchlearning' }}
          EPIC_ISSUE: ${{ github.event.inputs.epic_issue || '14' }}
          PROJECT_TITLE: ${{ github.event.inputs.project_title || 'Dutch Learning - Unified Flashcards' }}
          RELATED_ITEMS: ${{ github.event.inputs.related_items || 'pr:13:in_progress,issue:12:todo,issue:8:todo' }}
          BOARD_VIEW_NAME: Epic Board
        run: bash .github/scripts/manage-epic-board.sh
