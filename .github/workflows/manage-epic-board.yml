name: Manage Epic Board

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Repository in owner/name form"
        required: true
        default: "dabutchart-sudo/dutchlearning"
        type: string
      epic_issue:
        description: "Epic issue number"
        required: true
        type: string
      project_title:
        description: "GitHub Project title"
        required: true
        type: string
      related_items:
        description: "Comma-separated type:number:status entries"
        required: false
        default: ""
        type: string
  push:
    paths:
      - .github/epic-board-request.json
      - .github/workflows/manage-epic-board.yml

permissions:
  contents: read

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load request
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET_REPO: ${{ github.event.inputs.target_repo }}
          INPUT_EPIC_ISSUE: ${{ github.event.inputs.epic_issue }}
          INPUT_PROJECT_TITLE: ${{ github.event.inputs.project_title }}
          INPUT_RELATED_ITEMS: ${{ github.event.inputs.related_items }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "TARGET_REPO=$(jq -r '.target_repo' .github/epic-board-request.json)" >> "$GITHUB_ENV"
            echo "EPIC_ISSUE=$(jq -r '.epic_issue' .github/epic-board-request.json)" >> "$GITHUB_ENV"
            echo "PROJECT_TITLE=$(jq -r '.project_title' .github/epic-board-request.json)" >> "$GITHUB_ENV"
            echo "RELATED_ITEMS=$(jq -r '.related_items // ""' .github/epic-board-request.json)" >> "$GITHUB_ENV"
          else
            echo "TARGET_REPO=$INPUT_TARGET_REPO" >> "$GITHUB_ENV"
            echo "EPIC_ISSUE=$INPUT_EPIC_ISSUE" >> "$GITHUB_ENV"
            echo "PROJECT_TITLE=$INPUT_PROJECT_TITLE" >> "$GITHUB_ENV"
            echo "RELATED_ITEMS=$INPUT_RELATED_ITEMS" >> "$GITHUB_ENV"
          fi

      - name: Run epic board manager
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          OWNER_NODE_ID: U_kgDODrSTyg
          BOARD_VIEW_NAME: Epic Board
        run: bash .github/scripts/manage-epic-board.sh
